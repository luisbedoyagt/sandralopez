<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia y Librería M&S - ERP Pro</title>
  <style>
    :root {
      --sidebar-width: 270px;
      --primary-bg: #0f172a;
      --primary-accent: #3b82f6;
      --primary-accent-hover: #2563eb;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --gradient-bg: linear-gradient(135deg, #1e1b4b 0%, #312e81 35%, #0f172a 100%);
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.95);
      --bg-app: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --radius: 14px;
      --shadow-pro: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    /* PANTALLA DE ACCESO (LOGIN PRO) */
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--gradient-bg);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* EFECTOS DE LUZ EN DEGRADADO */
    .login-wrapper::before, .login-wrapper::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--primary-accent);
      filter: blur(100px);
      opacity: 0.25;
    }
    .login-wrapper::before { top: -50px; left: -50px; }
    .login-wrapper::after { bottom: -50px; right: -50px; background: #8b5cf6; }

    #section-login {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      padding: 44px 36px;
      border-radius: 20px;
      box-shadow: var(--shadow-pro);
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    .login-logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-logo-container img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      border: 3px solid #ffffff;
    }

    .login-header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .login-form .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .login-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #334155;
    }

    .login-form input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background-color: #f8fafc;
      transition: all 0.25s ease;
    }

    .login-form input:focus {
      outline: none;
      border-color: var(--primary-accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .btn-login {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      margin-top: 10px;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
      transition: all 0.25s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -3px rgba(37, 99, 235, 0.4);
    }

    /* ESTRUCTURA GENERAL DEL SISTEMA */
    #section-app { display: flex; width: 100%; min-height: 100vh; }

    aside {
      width: var(--sidebar-width);
      background: var(--primary-bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .brand-container img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-accent);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }
    .brand-title span { color: var(--primary-accent); }

    .nav-menu { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }

    .nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      text-align: left;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .nav-btn.active { background: var(--primary-accent); color: #fff; font-weight: 700; }

    main { flex-grow: 1; padding: 32px; overflow-y: auto; }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .btn-logout {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 9px 18px;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-logout:hover { background: #fca5a5; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 28px; }
    .card-kpi { background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); }
    .card-kpi p { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .card-kpi h3 { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }

    .panel-card {
      background: var(--surface);
      padding: 28px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      max-width: 800px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.875rem; }
    
    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background-color: #f8fafc;
    }

    .btn-action {
      background: var(--primary-accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    .btn-success { background: var(--accent-green); }
    .btn-success:hover { background: var(--accent-green-hover); }

    .table-wrapper { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    .table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; background: #f8fafc; border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f8fafc; padding: 14px 20px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    
    .stock-error { color: var(--danger); font-size: 0.85rem; font-weight: 600; margin-top: 4px; display: none; }
  </style>
</head>
<body>

  <!-- PANTALLA DE ACCESO (LOGIN PRO) -->
  <div id="login-container-wrapper" class="login-wrapper">
    <div id="section-login">
      
      <!-- LOGO LOCAL -->
      <div class="login-logo-container">
        <img src="img.jpeg" alt="Logo M&S">
      </div>

      <div class="login-header">
        <h1>Farmacia y Librería M&S</h1>
        <p>Sistema de Control y Punto de Venta</p>
      </div>

      <div class="login-form">
        <div class="form-group">
          <label for="login-user">Usuario</label>
          <input type="text" id="login-user" placeholder="Ej. admin o mostrador" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-pass">Contraseña</label>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeyup="if(event.key==='Enter') login()">
        </div>
        <button id="btn-submit-login" class="btn-login" onclick="login()">Iniciar Sesión</button>
      </div>

    </div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div id="section-app" class="hidden">
    <aside>
      <div class="brand-container">
        <img src="img.jpeg" alt="Logo M&S">
        <div class="brand-title"><span>M&S</span> POS</div>
      </div>
      <nav class="nav-menu">
        <button id="nav-ventas" class="nav-btn" onclick="showTab('ventas')">🛒 Registrar Venta</button>
        <button id="nav-inventario" class="nav-btn" onclick="showTab('inventario')">📦 Inventario</button>
        <button id="nav-registro-prod" class="nav-btn" onclick="showTab('registro-prod')">➕ Nuevo Producto</button>
      </nav>
    </aside>

    <main>
      <header class="top-header">
        <div class="user-info" id="user-welcome">Cargando...</div>
        <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
      </header>

      <!-- TAB: VENTA -->
      <div id="tab-ventas" class="hidden">
        <div class="panel-card">
          <h2>Punto de Venta</h2>
          <br>
          <div class="form-group">
            <label>Seleccionar Producto</label>
            <select id="v-producto" onchange="validarYCalcular()"></select>
          </div>
          <div class="form-group">
            <label>Cantidad a Vender</label>
            <input type="number" id="v-cantidad" value="1" min="1" oninput="validarYCalcular()">
            <div id="stock-error-msg" class="stock-error">⚠️ Cantidad supera el stock disponible.</div>
          </div>
          <div class="form-group">
            <label>Total A Cobrar</label>
            <input type="text" id="v-total" readonly style="font-size: 1.25rem; font-weight: 800; color: var(--accent-green); background: #f0fdf4;">
          </div>
          <button id="btn-completar-venta" class="btn-action btn-success" onclick="guardarVenta()">Completar Venta</button>
        </div>
      </div>

      <!-- TAB: INVENTARIO -->
      <div id="tab-inventario" class="hidden">
        <div class="kpi-grid">
          <div class="card-kpi"><p>Total Productos</p><h3 id="kpi-total-prod">0</h3></div>
          <div class="card-kpi"><p>Farmacia</p><h3 id="kpi-farmacia">0</h3></div>
          <div class="card-kpi"><p>Librería</p><h3 id="kpi-libreria">0</h3></div>
        </div>

        <div class="table-wrapper">
          <div class="table-toolbar">
            <input type="text" id="search-inventario" placeholder="🔍 Buscar producto..." onkeyup="filtrarTabla()" style="max-width: 300px;">
            <button class="btn-action" onclick="cargarInventario()" style="width: auto; padding: 8px 16px;">🔄 Actualizar Data</button>
          </div>
          <table id="table-inventario">
            <thead>
              <tr>
                <th>Código / ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio Costo</th>
                <th>Precio Venta</th>
                <th>Stock Disponible</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: NUEVO PRODUCTO -->
      <div id="tab-registro-prod" class="hidden">
        <div class="panel-card">
          <h2>Agregar Producto al Inventario</h2>
          <br>
          <div class="form-group">
            <label>Código de Producto / Barra</label>
            <input type="text" id="p-id" placeholder="Ej. PROD-001 o Código de barras">
          </div>
          <div class="form-group">
            <label>Nombre del Producto</label>
            <input type="text" id="p-nombre" placeholder="Ej. Acetaminofén 500mg">
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="p-categoria">
              <option value="Farmacia">Farmacia</option>
              <option value="Libreria">Librería</option>
            </select>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label>Precio de Costo (Q)</label>
              <input type="number" step="0.01" id="p-costo" placeholder="0.00" min="0">
            </div>
            <div class="form-group">
              <label>Precio de Venta (Q)</label>
              <input type="number" step="0.01" id="p-precio" placeholder="0.00" min="0">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label>Stock Inicial</label>
              <input type="number" id="p-stock" value="10" min="0">
            </div>
            <div class="form-group">
              <label>Stock Mínimo Alerta</label>
              <input type="number" id="p-stock-min" value="5" min="1">
            </div>
          </div>
          <button class="btn-action btn-success" onclick="guardarProducto()">Guardar Producto</button>
        </div>
      </div>

    </main>
  </div>

<script>
  // REEMPLAZAR CON LA URL DE TU WEB APP IMPLEMENTADA EN APPS SCRIPT (/exec)
  const API_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI"; 
  let currentUser = "";
  let currentRol = "";
  let inventarioData = [];

  window.onload = () => {
    const savedUser = localStorage.getItem("ms_user");
    const savedRol = localStorage.getItem("ms_rol");

    if (savedUser && savedRol) {
      currentUser = savedUser;
      currentRol = savedRol;
      iniciarSesionUI();
    }
  };

  async function apiRequest(payload) {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    return await res.json();
  }

  async function login() {
    const usuario = document.getElementById("login-user").value;
    const clave = document.getElementById("login-pass").value;
    const btn = document.getElementById("btn-submit-login");

    if (!usuario || !clave) {
      alert("Por favor ingresa usuario y contraseña.");
      return;
    }

    btn.innerText = "Verificando...";
    btn.disabled = true;

    try {
      const res = await apiRequest({ action: "login", usuario, clave });

      if (res.success) {
        currentUser = res.nombre;
        currentRol = res.rol || "mostrador";
        
        localStorage.setItem("ms_user", currentUser);
        localStorage.setItem("ms_rol", currentRol);

        iniciarSesionUI();
      } else {
        alert(res.message || "Usuario o contraseña incorrectos");
      }
    } catch (e) {
      alert("Error al conectar con el servidor.");
    } finally {
      btn.innerText = "Iniciar Sesión";
      btn.disabled = false;
    }
  }

  function iniciarSesionUI() {
    document.getElementById("user-welcome").innerText = `Usuario: ${currentUser} (${currentRol.toUpperCase()})`;
    document.getElementById("login-container-wrapper").classList.add("hidden");
    document.getElementById("section-app").classList.remove("hidden");
    
    aplicarPermisosRol(currentRol);
    cargarInventario();
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  function aplicarPermisosRol(rol) {
    const btnNuevoProd = document.getElementById("nav-registro-prod");
    const esAdmin = rol.toLowerCase() === "admin";

    if (!esAdmin) {
      if (btnNuevoProd) btnNuevoProd.style.display = "none";
      showTab("ventas");
    } else {
      if (btnNuevoProd) btnNuevoProd.style.display = "flex";
      showTab("inventario");
    }
  }

  function showTab(tabName) {
    ["inventario", "registro-prod", "ventas"].forEach(t => {
      document.getElementById(`tab-${t}`).classList.add("hidden");
      document.getElementById(`nav-${t}`).classList.remove("active");
    });
    document.getElementById(`tab-${tabName}`).classList.remove("hidden");
    document.getElementById(`nav-${tabName}`).classList.add("active");
  }

  async function cargarInventario() {
    const res = await apiRequest({ action: "getInventario" });
    if (res.success) {
      inventarioData = res.inventario;
      const tbody = document.querySelector("#table-inventario tbody");
      const selectVenta = document.getElementById("v-producto");
      
      tbody.innerHTML = "";
      selectVenta.innerHTML = "";

      let cntFarmacia = 0;
      let cntLibreria = 0;

      inventarioData.forEach(item => {
        if (item.categoria === 'Farmacia') cntFarmacia++;
        if (item.categoria === 'Libreria') cntLibreria++;

        const stockBadge = item.stock > item.stockMin 
          ? `<span class="badge badge-success">${item.stock} disponibles</span>` 
          : `<span class="badge badge-danger">${item.stock} crítico</span>`;

        tbody.innerHTML += `<tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.nombre}</td>
          <td>${item.categoria}</td>
          <td>Q ${parseFloat(item.costo).toFixed(2)}</td>
          <td>Q ${parseFloat(item.precio).toFixed(2)}</td>
          <td>${stockBadge}</td>
        </tr>`;

        selectVenta.innerHTML += `<option value="${item.nombre}" data-precio="${item.precio}" data-stock="${item.stock}">${item.nombre} (Disponibles: ${item.stock})</option>`;
      });

      document.getElementById("kpi-total-prod").innerText = inventarioData.length;
      document.getElementById("kpi-farmacia").innerText = cntFarmacia;
      document.getElementById("kpi-libreria").innerText = cntLibreria;

      validarYCalcular();
    }
  }

  function validarYCalcular() {
    const select = document.getElementById("v-producto");
    const inputCant = document.getElementById("v-cantidad");
    const btnVenta = document.getElementById("btn-completar-venta");
    const msgError = document.getElementById("stock-error-msg");

    if (!select.options.length) return;

    const optionSelected = select.options[select.selectedIndex];
    const precio = parseFloat(optionSelected.getAttribute("data-precio"));
    const stockDisponible = parseInt(optionSelected.getAttribute("data-stock"));
    const cantidadSolicitada = parseInt(inputCant.value) || 0;

    if (cantidadSolicitada > stockDisponible) {
      msgError.style.display = "block";
      msgError.innerText = `⚠️ Stock insuficiente. Solo quedan ${stockDisponible} unidades disponibles.`;
      btnVenta.disabled = true;
      btnVenta.style.opacity = "0.5";
      btnVenta.style.cursor = "not-allowed";
    } else {
      msgError.style.display = "none";
      btnVenta.disabled = false;
      btnVenta.style.opacity = "1";
      btnVenta.style.cursor = "pointer";
    }

    document.getElementById("v-total").value = `Q ${(precio * cantidadSolicitada).toFixed(2)}`;
  }

  function filtrarTabla() {
    const query = document.getElementById("search-inventario").value.toLowerCase();
    const rows = document.querySelectorAll("#table-inventario tbody tr");
    rows.forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
    });
  }

  async function guardarProducto() {
    const inputId = document.getElementById("p-id");
    const payload = {
      action: "addProducto",
      usuario: currentUser,
      id: inputId.value,
      codigo: inputId.value,
      nombre: document.getElementById("p-nombre").value,
      categoria: document.getElementById("p-categoria").value,
      costo: document.getElementById("p-costo").value,
      precio: document.getElementById("p-precio").value,
      stock: document.getElementById("p-stock").value,
      stockMin: document.getElementById("p-stock-min").value
    };

    const res = await apiRequest(payload);

    if (res.success) {
      alert("✅ " + res.message);
      inputId.value = "";
      document.getElementById("p-nombre").value = "";
      document.getElementById("p-costo").value = "";
      document.getElementById("p-precio").value = "";
      document.getElementById("p-stock").value = "10";
      document.getElementById("p-stock-min").value = "5";
      
      await cargarInventario();
      aplicarPermisosRol(currentRol);
    } else {
      alert("⚠️ " + res.message);
      if (res.siguienteCodigo) {
        inputId.value = res.siguienteCodigo;
        inputId.focus();
      }
    }
  }

  async function guardarVenta() {
    const rawTotal = document.getElementById("v-total").value.replace("Q ", "");
    const payload = {
      action: "addVenta",
      usuario: currentUser,
      producto: document.getElementById("v-producto").value,
      cantidad: document.getElementById("v-cantidad").value,
      total: rawTotal
    };

    const res = await apiRequest(payload);
    if (res.success) {
      alert("✅ " + res.message);
      document.getElementById("v-cantidad").value = "1";
      
      await cargarInventario();
      aplicarPermisosRol(currentRol);
    } else {
      alert("⚠️ No se realizó la venta: " + res.message);
    }
  }
</script>

</body>
</html>
