on:"B2"},{id:"p11",codigo:"CAL105",nombre:"Calculadora Científica Casio fx-82",categoria:"libreria",stock:7,minimo:5,precio_compra:85,precio_venta:120,vencimiento:null,ubicacion:"B3"},{id:"p12",codigo:"LIB106",nombre:"Libro para Colorear Infantil",categoria:"libreria",stock:22,minimo:10,precio_compra:15,precio_venta:25,vencimiento:null,ubicacion:"B3"}],To=[{usuario:"admin",nombre:"Administrador",password:btoa("admin123"),rol:"admin",activo:!0},{usuario:"mostrador",nombre:"Mostrador",password:btoa("1234"),rol:"mostrador",activo:!0}],Pf=`// FARMACIA Y LIBRERÍA M&S v3.0 - Código para Google Apps Script
// 1) Crea una hoja con pestañas: inventario, ventas, movimientos, usuarios
// 2) Pega este código en Code.gs y Despliega como Web App (Anyone)
// Empresa: Farmacia y Librería M&S

const SHEETS = {
  inventario: 'inventario',
  ventas: 'ventas',
  movimientos: 'movimientos',
  usuarios: 'usuarios'
};

function doGet(e){
  const action = e.parameter.action;
  if(action==='ping') return json({ok:true, msg:'M&S conectado correctamente - Farmacia y Librería M&S'});
  if(action==='getInventario') return json(getSheetData(SHEETS.inventario));
  if(action==='getMovimientos') return json(getSheetData(SHEETS.movimientos));
  if(action==='getUsuarios') return json(getSheetData(SHEETS.usuarios));
  if(action==='getVentas') return json(getSheetData(SHEETS.ventas));
  return json({ok:false, error:'action no soportada'});
}

function doPost(e){
  try{
    const data = JSON.parse(e.postData.contents);
    const action = data.action;
    if(action==='login'){
      const usuarios = getSheetData(SHEETS.usuarios);
      const u = usuarios.find(x=> x.usuario===data.usuario && x.password===Utilities.base64Encode(data.password) && String(x.activo)==='true');
      if(!u) return json({ok:false, error:'Credenciales inválidas'});
      return json({ok:true, usuario:u});
    }
    if(action==='addProducto'){
      appendRow(SHEETS.inventario, data.producto);
      return json({ok:true});
    }
    if(action==='updateProducto'){
      updateById(SHEETS.inventario, data.producto.id, data.producto);
      return json({ok:true});
    }
    if(action==='deleteProducto'){
      deleteById(SHEETS.inventario, data.id);
      return json({ok:true});
    }
    if(action==='registrarVenta'){
      appendRow(SHEETS.ventas, data.venta);
      (data.movimientos||[]).forEach(m=> appendRow(SHEETS.movimientos, m));
      (data.productosActualizados||[]).forEach(p=> updateById(SHEETS.inventario, p.id, p));
      return json({ok:true});
    }
    if(action==='addUsuario'){
      appendRow(SHEETS.usuarios, data.usuario);
      return json({ok:true});
    }
    return json({ok:false, error:'action no soportada '+action});
  }catch(err){
    return json({ok:false, error: err.message});
  }
}

function json(obj){ return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }
function getSheetData(name){
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  if(!sh) return [];
  const values = sh.getDataRange().getValues();
  const headers = values[0];
  return values.slice(1).map(r=>{
    const o={}; headers.forEach((h,i)=> o[h]=r[i]); return o;
  });
}
function appendRow(name, obj){
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  const headers = sh.getRange(1,1,1,sh.getLastColumn()).getValues()[0];
  const row = headers.map(h=> obj[h] ?? '');
  sh.appendRow(row);
}
function updateById(name, id, obj){
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  const values = sh.getDataRange().getValues();
  const headers = values[0];
  const idIdx = headers.indexOf('id');
  for(let i=1;i<values.length;i++){
    if(String(values[i][idIdx])===String(id)){
      const row = headers.map(h=> obj[h] ?? values[i][headers.indexOf(h)]);
      sh.getRange(i+1,1,1,row.length).setValues([row]);
      return;
    }
  }
