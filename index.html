// Crea 3 hojas: Inventario, Ventas, Movimientos

function doGet(e) {
  const action = e.parameter.action;
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  
  if (action === 'getInventario') {
    const sheet = ss.getSheetByName('Inventario');
    const rows = sheet.getDataRange().getValues();
    const headers = rows[0];
    const data = rows.slice(1).map(r => {
      let obj = {};
      headers.forEach((h,i) => obj[h] = r[i]);
      return obj;
    });
    return ContentService.createTextOutput(JSON.stringify({data})).setMimeType(ContentService.MimeType.JSON);
  }
  
  return ContentService.createTextOutput(JSON.stringify({error:'action no soportada'})).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  const body = JSON.parse(e.postData.contents);
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  
  if (body.action === 'addProducto') {
    const s = ss.getSheetByName('Inventario');
    const p = body.producto;
    s.appendRow([p.codigo, p.nombre, p.categoria, p.stock, p.stock_minimo, p.precio_compra, p.precio_venta, p.vencimiento, p.proveedor, p.ubicacion, p.descripcion]);
  }
  if (body.action === 'addVenta') {
    const s = ss.getSheetByName('Ventas');
    s.appendRow([new Date(), JSON.stringify(body.venta), body.venta.total]);
  }
  if (body.action === 'addMovimiento') {
    const s = ss.getSheetByName('Movimientos');
    const m = body.movimiento;
    s.appendRow([new Date(), m.tipo, m.codigo, m.producto, m.cantidad, m.usuario, m.nota]);
  }
  
  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
}
