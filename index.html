<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia y Librería M&S - ERP</title>
  <style>
    :root {
      --sidebar-width: 260px;
      --primary: #0f172a;
      --primary-accent: #2563eb;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    /* LOGIN */
    #section-login {
      width: 100%;
      max-width: 420px;
      margin: auto;
      background: var(--surface);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    #section-app { display: flex; width: 100%; min-height: 100vh; }

    /* SIDEBAR */
    aside {
      width: var(--sidebar-width);
      background: var(--primary);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 32px;
      padding: 0 12px;
      color: #fff;
    }
    .brand span { color: var(--primary-accent); }

    .nav-menu { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }

    .nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      text-align: left;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .nav-btn.active { background: var(--primary-accent); color: #fff; }

    /* CONTENIDO */
    main { flex-grow: 1; padding: 32px; overflow-y: auto; }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .btn-logout {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
    }

    /* CARDS & FORMULARIOS */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 28px; }
    .card-kpi { background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); }
    .card-kpi p { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .card-kpi h3 { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }

    .panel-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      max-width: 800px;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.875rem; }
    
    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background-color: #f8fafc;
    }

    .btn-action {
      background: var(--primary-accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    .btn-success { background: var(--accent-green); }
    .btn-success:hover { background: var(--accent-green-hover); }

    /* TABLAS */
    .table-wrapper { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    .table-toolbar { padding: 16px 20px; display: flex; justify-content: space-between; background: #f8fafc; border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f8fafc; padding: 14px 20px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    
    .stock-error { color: var(--danger); font-size: 0.85rem; font-weight: 600; margin-top: 4px; display: none; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="section-login">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.5rem; color: var(--primary); font-weight: 800;">Farmacia y Librería M&S</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Ingrese sus credenciales</p>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="admin o mostrador">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn-action" onclick="login()">Iniciar Sesión</button>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div id="section-app" class="hidden">
    <aside>
      <div class="brand"><span>M&S</span> POS</div>
      <nav class="nav-menu">
        <button id="nav-ventas" class="nav-btn" onclick="showTab('ventas')">🛒 Registrar Venta</button>
        <button id="nav-inventario" class="nav-btn" onclick="showTab('inventario')">📦 Inventario</button>
        <button id="nav-registro-prod" class="nav-btn" onclick="showTab('registro-prod')">➕ Nuevo Producto</button>
      </nav>
    </aside>

    <main>
      <header class="top-header">
        <div class="user-info" id="user-welcome">Cargando...</div>
        <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
      </header>

      <!-- TAB: VENTA -->
      <div id="tab-ventas" class="hidden">
        <div class="panel-card">
          <h2>Punto de Venta</h2>
          <br>
          <div class="form-group">
            <label>Seleccionar Producto</label>
            <select id="v-producto" onchange="validarYCalcular()"></select>
          </div>
          <div class="form-group">
            <label>Cantidad a Vender</label>
            <input type="number" id="v-cantidad" value="1" min="1" oninput="validarYCalcular()">
            <div id="stock-error-msg" class="stock-error">⚠️ Cantidad supera el stock disponible.</div>
          </div>
          <div class="form-group">
            <label>Total A Cobrar</label>
            <input type="text" id="v-total" readonly style="font-size: 1.25rem; font-weight: 800; color: var(--accent-green); background: #f0fdf4;">
          </div>
          <button id="btn-completar-venta" class="btn-action btn-success" onclick="guardarVenta()">Completar Venta</button>
        </div>
      </div>

      <!-- TAB: INVENTARIO -->
      <div id="tab-inventario" class="hidden">
        <div class="kpi-grid">
          <div class="card-kpi"><p>Total Productos</p><h3 id="kpi-total-prod">0</h3></div>
          <div class="card-kpi"><p>Farmacia</p><h3 id="kpi-farmacia">0</h3></div>
          <div class="card-kpi"><p>Librería</p><h3 id="kpi-libreria">0</h3></div>
        </div>

        <div class="table-wrapper">
          <div class="table-toolbar">
            <input type="text" id="search-inventario" placeholder="🔍 Buscar producto..." onkeyup="filtrarTabla()" style="max-width: 300px;">
            <button class="btn-action" onclick="cargarInventario()" style="width: auto; padding: 8px 16px;">🔄 Actualizar Data</button>
          </div>
          <table id="table-inventario">
            <thead>
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Stock Disponible</th>
                <th>Precio Unitario</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: NUEVO PRODUCTO -->
      <div id="tab-registro-prod" class="hidden">
        <div class="panel-card">
          <h2>Agregar Producto al Inventario</h2>
          <br>
          <div class="form-group"><label>ID / Código de Barra</label><input type="text" id="p-id"></div>
          <div class="form-group"><label>Nombre del Producto</label><input type="text" id="p-nombre"></div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="p-categoria">
              <option value="Farmacia">Farmacia</option>
              <option value="Libreria">Librería</option>
            </select>
          </div>
          <div class="form-group"><label>Stock Inicial</label><input type="number" id="p-stock" value="10" min="0"></div>
          <div class="form-group"><label>Precio Unitario (Q)</label><input type="number" step="0.01" id="p-precio" placeholder="0.00" min="0"></div>
          <button class="btn-action btn-success" onclick="guardarProducto()">Guardar Producto</button>
        </div>
      </div>

    </main>
  </div>

<script>
  // Reemplaza TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI con tu enlace /exec
  const API_URL = "https://script.google.com/macros/s/AKfycbx7EzwUFn5kyFpGwprSb-wRN-NXP-B9rF-MY8TEk-H-YRidlEYrET4u928E-EsdtSRK/exec"; 
  let currentUser = "";
  let currentRol = "";
  let inventarioData = [];

  // AL CARGAR LA PÁGINA: Comprobar sesión guardada (Evita deslogueos al recargar F5)
  window.onload = () => {
    const savedUser = localStorage.getItem("ms_user");
    const savedRol = localStorage.getItem("ms_rol");

    if (savedUser && savedRol) {
      currentUser = savedUser;
      currentRol = savedRol;
      iniciarSesionUI();
    }
  };

  async function apiRequest(payload) {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    return await res.json();
  }

  async function login() {
    const usuario = document.getElementById("login-user").value;
    const clave = document.getElementById("login-pass").value;
    const res = await apiRequest({ action: "login", usuario, clave });

    if (res.success) {
      currentUser = res.nombre;
      currentRol = res.rol || "mostrador";
      
      // Guardar sesión persistente
      localStorage.setItem("ms_user", currentUser);
      localStorage.setItem("ms_rol", currentRol);

      iniciarSesionUI();
    } else {
      alert(res.message || "Error al autenticar");
    }
  }

  function iniciarSesionUI() {
    document.getElementById("user-welcome").innerText = `Usuario: ${currentUser} (${currentRol.toUpperCase()})`;
    document.getElementById("section-login").classList.add("hidden");
    document.getElementById("section-app").classList.remove("hidden");
    
    aplicarPermisosRol(currentRol);
    cargarInventario();
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  function aplicarPermisosRol(rol) {
    const btnNuevoProd = document.getElementById("nav-registro-prod");
    const esAdmin = rol.toLowerCase() === "admin";

    if (!esAdmin) {
      if (btnNuevoProd) btnNuevoProd.style.display = "none";
      showTab("ventas");
    } else {
      if (btnNuevoProd) btnNuevoProd.style.display = "flex";
      showTab("inventario");
    }
  }

  function showTab(tabName) {
    ["inventario", "registro-prod", "ventas"].forEach(t => {
      document.getElementById(`tab-${t}`).classList.add("hidden");
      document.getElementById(`nav-${t}`).classList.remove("active");
    });
    document.getElementById(`tab-${tabName}`).classList.remove("hidden");
    document.getElementById(`nav-${tabName}`).classList.add("active");
  }

  async function cargarInventario() {
    const res = await apiRequest({ action: "getInventario" });
    if (res.success) {
      inventarioData = res.inventario;
      const tbody = document.querySelector("#table-inventario tbody");
      const selectVenta = document.getElementById("v-producto");
      
      tbody.innerHTML = "";
      selectVenta.innerHTML = "";

      let cntFarmacia = 0;
      let cntLibreria = 0;

      inventarioData.forEach(item => {
        if (item.categoria === 'Farmacia') cntFarmacia++;
        if (item.categoria === 'Libreria') cntLibreria++;

        const stockBadge = item.stock > 5 
          ? `<span class="badge badge-success">${item.stock} disponibles</span>` 
          : `<span class="badge badge-danger">${item.stock} crítico</span>`;

        tbody.innerHTML += `<tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.nombre}</td>
          <td>${item.categoria}</td>
          <td>${stockBadge}</td>
          <td>Q ${parseFloat(item.precio).toFixed(2)}</td>
        </tr>`;

        selectVenta.innerHTML += `<option value="${item.nombre}" data-precio="${item.precio}" data-stock="${item.stock}">${item.nombre} (Disponibles: ${item.stock})</option>`;
      });

      document.getElementById("kpi-total-prod").innerText = inventarioData.length;
      document.getElementById("kpi-farmacia").innerText = cntFarmacia;
      document.getElementById("kpi-libreria").innerText = cntLibreria;

      validarYCalcular();
    }
  }

  // VALIDACIÓN DE STOCK EN TIEMPO REAL
  function validarYCalcular() {
    const select = document.getElementById("v-producto");
    const inputCant = document.getElementById("v-cantidad");
    const btnVenta = document.getElementById("btn-completar-venta");
    const msgError = document.getElementById("stock-error-msg");

    if (!select.options.length) return;

    const optionSelected = select.options[select.selectedIndex];
    const precio = parseFloat(optionSelected.getAttribute("data-precio"));
    const stockDisponible = parseInt(optionSelected.getAttribute("data-stock"));
    const cantidadSolicitada = parseInt(inputCant.value) || 0;

    // Control estricto de Stock
    if (cantidadSolicitada > stockDisponible) {
      msgError.style.display = "block";
      msgError.innerText = `⚠️ Stock insuficiente. Solo quedan ${stockDisponible} unidades disponibles.`;
      btnVenta.disabled = true;
      btnVenta.style.opacity = "0.5";
      btnVenta.style.cursor = "not-allowed";
    } else {
      msgError.style.display = "none";
      btnVenta.disabled = false;
      btnVenta.style.opacity = "1";
      btnVenta.style.cursor = "pointer";
    }

    document.getElementById("v-total").value = `Q ${(precio * cantidadSolicitada).toFixed(2)}`;
  }

  function filtrarTabla() {
    const query = document.getElementById("search-inventario").value.toLowerCase();
    const rows = document.querySelectorAll("#table-inventario tbody tr");
    rows.forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
    });
  }

  async function guardarProducto() {
    const payload = {
      action: "addProducto",
      usuario: currentUser,
      id: document.getElementById("p-id").value,
      nombre: document.getElementById("p-nombre").value,
      categoria: document.getElementById("p-categoria").value,
      stock: document.getElementById("p-stock").value,
      precio: document.getElementById("p-precio").value
    };

    const res = await apiRequest(payload);
    if (res.success) {
      alert("✅ " + res.message);
      // Limpiar campos
      document.getElementById("p-id").value = "";
      document.getElementById("p-nombre").value = "";
      document.getElementById("p-stock").value = "10";
      document.getElementById("p-precio").value = "";
      
      // Redirigir al menú inicial
      await cargarInventario();
      aplicarPermisosRol(currentRol);
    } else {
      alert("❌ Error: " + res.message);
    }
  }

  async function guardarVenta() {
    const rawTotal = document.getElementById("v-total").value.replace("Q ", "");
    const payload = {
      action: "addVenta",
      usuario: currentUser,
      producto: document.getElementById("v-producto").value,
      cantidad: document.getElementById("v-cantidad").value,
      total: rawTotal
    };

    const res = await apiRequest(payload);
    if (res.success) {
      alert("✅ " + res.message);
      document.getElementById("v-cantidad").value = "1";
      
      // Redirigir al menú inicial actualizando datos
      await cargarInventario();
      aplicarPermisosRol(currentRol);
    } else {
      alert("⚠️ No se realizó la venta: " + res.message);
    }
  }
</script>

</body>
</html>
