<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia y Librería M&S</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --accent: #059669;
      --accent-hover: #047857;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 8px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 20px 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .main-content {
      padding: 24px;
    }

    .hidden { display: none !important; }

    /* FORMULARIOS Y ELEMENTOS */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text);
    }

    input, select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: var(--radius);
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background-color: #fff;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
    }

    button {
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: white;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: translateY(1px); }

    .btn-full { width: 100%; margin-top: 8px; }
    .btn-accent { background: var(--accent); }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }

    /* PANEL LOGIN */
    #section-login {
      max-width: 400px;
      margin: 20px auto;
      padding: 10px;
    }

    #section-login h2 {
      margin-top: 0;
      text-align: center;
      font-size: 1.25rem;
      color: var(--text);
    }

    /* BARRA SUPERIOR APP */
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .user-badge {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* NAVEGACIÓN PESTAÑAS */
    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .nav button {
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius);
      padding: 8px 16px;
    }

    .nav button:hover {
      background: var(--bg);
      color: var(--text);
    }

    .nav button.active {
      background: var(--primary);
      color: white;
    }

    /* TABLAS */
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background-color: rgba(248, 250, 252, 0.8); }

    .header-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-action h3 { margin: 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Farmacia y Librería M&S</h1>
  </header>

  <div class="main-content">
    <!-- LOGIN -->
    <div id="section-login">
      <h2>Iniciar Sesión</h2>
      <div class="form-group">
        <label for="login-user">Usuario</label>
        <input type="text" id="login-user" placeholder="Ej: admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-full" onclick="login()">Ingresar al Sistema</button>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="section-app" class="hidden">
      <div class="user-bar">
        <span id="user-welcome" class="user-badge"></span>
        <button onclick="logout()" class="btn-danger">Cerrar Sesión</button>
      </div>

      <nav class="nav">
        <button id="btn-tab-inventario" class="active" onclick="switchTab('inventario')">Ver Inventario</button>
        <button id="btn-tab-registro-prod" onclick="switchTab('registro-prod')">Nuevo Producto</button>
        <button id="btn-tab-ventas" onclick="switchTab('ventas')">Registrar Venta</button>
      </nav>

      <!-- PESTAÑA INVENTARIO -->
      <div id="tab-inventario">
        <div class="header-action">
          <h3>Inventario Actual</h3>
          <button onclick="cargarInventario()">🔄 Actualizar Data</button>
        </div>
        <div class="table-container">
          <table id="table-inventario">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Precio</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- PESTAÑA NUEVO PRODUCTO -->
      <div id="tab-registro-prod" class="hidden">
        <h3>Agregar Nuevo Producto</h3>
        <div class="form-group"><label for="p-id">ID / Código de Barras</label><input type="text" id="p-id"></div>
        <div class="form-group"><label for="p-nombre">Nombre del Producto</label><input type="text" id="p-nombre"></div>
        <div class="form-group">
          <label for="p-categoria">Categoría</label>
          <select id="p-categoria">
            <option value="Farmacia">Farmacia</option>
            <option value="Libreria">Librería</option>
          </select>
        </div>
        <div class="form-group"><label for="p-stock">Stock Inicial</label><input type="number" id="p-stock" min="0"></div>
        <div class="form-group"><label for="p-precio">Precio Unitario (Q)</label><input type="number" step="0.01" id="p-precio" min="0"></div>
        <button class="btn-accent btn-full" onclick="guardarProducto()">Guardar Producto</button>
      </div>

      <!-- PESTAÑA REGISTRO VENTA -->
      <div id="tab-ventas" class="hidden">
        <h3>Registrar Venta</h3>
        <div class="form-group">
          <label for="v-producto">Seleccionar Producto</label>
          <select id="v-producto" onchange="calcularTotal()"></select>
        </div>
        <div class="form-group">
          <label for="v-cantidad">Cantidad</label>
          <input type="number" id="v-cantidad" value="1" min="1" oninput="calcularTotal()">
        </div>
        <div class="form-group">
          <label for="v-total">Total A Cobrar</label>
          <input type="text" id="v-total" readonly style="background-color: var(--bg); font-weight: bold; color: var(--accent);">
        </div>
        <button class="btn-accent btn-full" onclick="guardarVenta()">Completar Venta</button>
      </div>

    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx8euu4PifPHa_agFuhcBSkJHSh9w8grpUTrldyphp8-aR01usXRri7s36SIqLT8QvF/exec"; 
  let currentUser = "";
  let inventarioData = [];

  async function apiRequest(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  async function login() {
    const usuario = document.getElementById("login-user").value;
    const clave = document.getElementById("login-pass").value;
    const res = await apiRequest({ action: "login", usuario, clave });

    if (res.success) {
      currentUser = res.nombre;
      document.getElementById("user-welcome").innerText = `Usuario: ${res.nombre} (${res.rol})`;
      document.getElementById("section-login").classList.add("hidden");
      document.getElementById("section-app").classList.remove("hidden");
      cargarInventario();
    } else {
      alert(res.message || "Error al autenticar");
    }
  }

  function logout() {
    location.reload();
  }

  function switchTab(tabName) {
    ["inventario", "registro-prod", "ventas"].forEach(t => {
      document.getElementById(`tab-${t}`).classList.add("hidden");
      document.getElementById(`btn-tab-${t}`).classList.remove("active");
    });
    document.getElementById(`tab-${tabName}`).classList.remove("hidden");
    document.getElementById(`btn-tab-${tabName}`).classList.add("active");
  }

  function showTab(tabName) {
    switchTab(tabName);
  }

  async function cargarInventario() {
    const res = await apiRequest({ action: "getInventario" });
    if (res.success) {
      inventarioData = res.inventario;
      const tbody = document.querySelector("#table-inventario tbody");
      const selectVenta = document.getElementById("v-producto");
      
      tbody.innerHTML = "";
      selectVenta.innerHTML = "";

      inventarioData.forEach(item => {
        tbody.innerHTML += `<tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.nombre}</td>
          <td>${item.categoria}</td>
          <td>${item.stock}</td>
          <td>Q ${parseFloat(item.precio).toFixed(2)}</td>
        </tr>`;

        selectVenta.innerHTML += `<option value="${item.nombre}" data-precio="${item.precio}">${item.nombre} (Stock: ${item.stock})</option>`;
      });
      calcularTotal();
    }
  }

  async function guardarProducto() {
    const payload = {
      action: "addProducto",
      id: document.getElementById("p-id").value,
      nombre: document.getElementById("p-nombre").value,
      categoria: document.getElementById("p-categoria").value,
      stock: document.getElementById("p-stock").value,
      precio: document.getElementById("p-precio").value
    };
    await apiRequest(payload);
    alert("Producto Guardado");
    switchTab("inventario");
    cargarInventario();
  }

  function calcularTotal() {
    const select = document.getElementById("v-producto");
    if (!select.options.length) return;
    const precio = select.options[select.selectedIndex].getAttribute("data-precio");
    const cant = document.getElementById("v-cantidad").value;
    document.getElementById("v-total").value = `Q ${(precio * cant).toFixed(2)}`;
  }

  async function guardarVenta() {
    const rawTotal = document.getElementById("v-total").value.replace("Q ", "");
    const payload = {
      action: "addVenta",
      usuario: currentUser,
      producto: document.getElementById("v-producto").value,
      cantidad: document.getElementById("v-cantidad").value,
      total: rawTotal
    };
    await apiRequest(payload);
    alert("Venta registrada con éxito");
    cargarInventario();
    switchTab("inventario");
  }
</script>

</body>
</html>
