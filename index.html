<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacia y Librería M&S - Sistema POS</title>
  <style>
    :root {
      --sidebar-width: 260px;
      --primary: #0f172a;
      --primary-accent: #2563eb;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    /* PANTALLA LOGIN */
    #section-login {
      width: 100%;
      max-width: 420px;
      margin: auto;
      background: var(--surface);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    #section-app {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* BARRA LATERAL (SIDEBAR) */
    aside {
      width: var(--sidebar-width);
      background: var(--primary);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      padding: 0 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand span { color: var(--primary-accent); }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      text-align: left;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .nav-btn.active {
      background: var(--primary-accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* CONTENIDO PRINCIPAL */
    main {
      flex-grow: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .user-info {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .btn-logout {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover { background: #fecaca; }

    /* CARDS KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .card-kpi {
      background: var(--surface);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .card-kpi p { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .card-kpi h3 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-top: 6px; }

    /* FORMULARIOS Y PANELES */
    .panel-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-width: 800px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-header h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.875rem; color: var(--text-main); }
    
    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background-color: #f8fafc;
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      background-color: #fff;
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-action {
      background: var(--primary-accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      font-size: 1rem;
    }

    .btn-action:hover { background: #1d4ed8; }
    .btn-success { background: var(--accent-green); }
    .btn-success:hover { background: var(--accent-green-hover); }

    /* TABLA DE INVENTARIO */
    .table-wrapper {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-toolbar {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    .table-toolbar input { max-width: 300px; background: #fff; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f8fafc; padding: 14px 20px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="section-login">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.5rem; color: var(--primary); font-weight: 800;">Farmacia y Librería M&S</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Ingresa tus credenciales para continuar</p>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="Ej: admin o mostrador">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn-action" onclick="login()">Iniciar Sesión</button>
  </div>

  <!-- PANEL PRINCIPAL (APP) -->
  <div id="section-app" class="hidden">
    <!-- BARRA LATERAL -->
    <aside>
      <div class="brand">
        <span>M&S</span> ERP System
      </div>
      <nav class="nav-menu">
        <button id="nav-ventas" class="nav-btn active" onclick="showTab('ventas')">
          🛒 Registrar Venta
        </button>
        <button id="nav-inventario" class="nav-btn" onclick="showTab('inventario')">
          📦 Inventario
        </button>
        <button id="nav-registro-prod" class="nav-btn" onclick="showTab('registro-prod')">
          ➕ Nuevo Producto
        </button>
      </nav>
    </aside>

    <!-- ÁREA DE TRABAJO -->
    <main>
      <header class="top-header">
        <div class="user-info" id="user-welcome">Cargando usuario...</div>
        <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
      </header>

      <!-- PESTAÑA REGISTRO VENTA (POS) -->
      <div id="tab-ventas">
        <div class="panel-card">
          <div class="panel-header">
            <h2>Punto de Venta (Mostrador)</h2>
          </div>
          <div class="form-group">
            <label>Seleccionar Producto</label>
            <select id="v-producto" onchange="calcularTotal()"></select>
          </div>
          <div class="form-group">
            <label>Cantidad a Vender</label>
            <input type="number" id="v-cantidad" value="1" min="1" oninput="calcularTotal()">
          </div>
          <div class="form-group">
            <label>Total A Cobrar</label>
            <input type="text" id="v-total" readonly style="font-size: 1.25rem; font-weight: 800; color: var(--accent-green); background: #f0fdf4;">
          </div>
          <button class="btn-action btn-success" onclick="guardarVenta()">Completar Venta</button>
        </div>
      </div>

      <!-- PESTAÑA INVENTARIO -->
      <div id="tab-inventario" class="hidden">
        <div class="kpi-grid" id="kpi-container">
          <div class="card-kpi">
            <p>Total Productos</p>
            <h3 id="kpi-total-prod">0</h3>
          </div>
          <div class="card-kpi">
            <p>Categoría Farmacia</p>
            <h3 id="kpi-farmacia">0</h3>
          </div>
          <div class="card-kpi">
            <p>Categoría Librería</p>
            <h3 id="kpi-libreria">0</h3>
          </div>
        </div>

        <div class="table-wrapper">
          <div class="table-toolbar">
            <input type="text" id="search-inventario" placeholder="🔍 Buscar producto..." onkeyup="filtrarTabla()">
            <button class="btn-action" onclick="cargarInventario()" style="width: auto; padding: 8px 16px;">🔄 Actualizar</button>
          </div>
          <table id="table-inventario">
            <thead>
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Estado Stock</th>
                <th>Precio Unitario</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- PESTAÑA NUEVO PRODUCTO (Solo Admin) -->
      <div id="tab-registro-prod" class="hidden">
        <div class="panel-card">
          <div class="panel-header">
            <h2>Registrar Nuevo Producto</h2>
          </div>
          <div class="form-group">
            <label>ID / Código de Producto</label>
            <input type="text" id="p-id" placeholder="Ej: PROD-001">
          </div>
          <div class="form-group">
            <label>Nombre del Producto</label>
            <input type="text" id="p-nombre" placeholder="Ej: Paracetamol 500mg">
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select id="p-categoria">
              <option value="Farmacia">Farmacia</option>
              <option value="Libreria">Librería</option>
            </select>
          </div>
          <div class="form-group">
            <label>Stock Inicial</label>
            <input type="number" id="p-stock" value="10" min="0">
          </div>
          <div class="form-group">
            <label>Precio Unitario (Q)</label>
            <input type="number" step="0.01" id="p-precio" placeholder="0.00" min="0">
          </div>
          <button class="btn-action btn-success" onclick="guardarProducto()">Guardar Producto</button>
        </div>
      </div>

    </main>
  </div>

<script>
  // Reemplaza TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI con tu enlace /exec
  const API_URL = "https://script.google.com/macros/s/AKfycbx8euu4PifPHa_agFuhcBSkJHSh9w8grpUTrldyphp8-aR01usXRri7s36SIqLT8QvF/exec"; 
  let currentUser = "";
  let currentRol = "";
  let inventarioData = [];

  async function apiRequest(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  async function login() {
    const usuario = document.getElementById("login-user").value;
    const clave = document.getElementById("login-pass").value;
    const res = await apiRequest({ action: "login", usuario, clave });

    if (res.success) {
      currentUser = res.nombre;
      currentRol = res.rol || "mostrador"; // Si el backend no envía rol, por defecto asume mostrador
      
      document.getElementById("user-welcome").innerText = `Usuario: ${res.nombre} (${currentRol.toUpperCase()})`;
      document.getElementById("section-login").classList.add("hidden");
      document.getElementById("section-app").classList.remove("hidden");
      
      aplicarPermisosRol(currentRol);
      cargarInventario();
    } else {
      alert(res.message || "Error al autenticar");
    }
  }

  function aplicarPermisosRol(rol) {
    const btnNuevoProd = document.getElementById("nav-registro-prod");
    const esAdmin = rol.toLowerCase() === "admin";

    if (!esAdmin) {
      // Ocultar opción de "Nuevo Producto" para la vista Mostrador
      if (btnNuevoProd) btnNuevoProd.style.display = "none";
      showTab("ventas");
    } else {
      // Mostrar acceso completo para Administrador
      if (btnNuevoProd) btnNuevoProd.style.display = "flex";
      showTab("inventario");
    }
  }

  function logout() {
    location.reload();
  }

  function showTab(tabName) {
    ["inventario", "registro-prod", "ventas"].forEach(t => {
      document.getElementById(`tab-${t}`).classList.add("hidden");
      document.getElementById(`nav-${t}`).classList.remove("active");
    });
    document.getElementById(`tab-${tabName}`).classList.remove("hidden");
    document.getElementById(`nav-${tabName}`).classList.add("active");
  }

  async function cargarInventario() {
    const res = await apiRequest({ action: "getInventario" });
    if (res.success) {
      inventarioData = res.inventario;
      const tbody = document.querySelector("#table-inventario tbody");
      const selectVenta = document.getElementById("v-producto");
      
      tbody.innerHTML = "";
      selectVenta.innerHTML = "";

      let cntFarmacia = 0;
      let cntLibreria = 0;

      inventarioData.forEach(item => {
        if (item.categoria === 'Farmacia') cntFarmacia++;
        if (item.categoria === 'Libreria') cntLibreria++;

        const stockBadge = item.stock > 5 
          ? `<span class="badge badge-success">${item.stock} en stock</span>` 
          : `<span class="badge badge-danger">${item.stock} crítico</span>`;

        tbody.innerHTML += `<tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.nombre}</td>
          <td>${item.categoria}</td>
          <td>${stockBadge}</td>
          <td>Q ${parseFloat(item.precio).toFixed(2)}</td>
        </tr>`;

        selectVenta.innerHTML += `<option value="${item.nombre}" data-precio="${item.precio}">${item.nombre} (Stock: ${item.stock})</option>`;
      });

      document.getElementById("kpi-total-prod").innerText = inventarioData.length;
      document.getElementById("kpi-farmacia").innerText = cntFarmacia;
      document.getElementById("kpi-libreria").innerText = cntLibreria;

      calcularTotal();
    }
  }

  function filtrarTabla() {
    const query = document.getElementById("search-inventario").value.toLowerCase();
    const rows = document.querySelectorAll("#table-inventario tbody tr");
    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(query) ? "" : "none";
    });
  }

  async function guardarProducto() {
    const payload = {
      action: "addProducto",
      id: document.getElementById("p-id").value,
      nombre: document.getElementById("p-nombre").value,
      categoria: document.getElementById("p-categoria").value,
      stock: document.getElementById("p-stock").value,
      precio: document.getElementById("p-precio").value
    };
    await apiRequest(payload);
    alert("Producto Guardado con éxito");
    showTab("inventario");
    cargarInventario();
  }

  function calcularTotal() {
    const select = document.getElementById("v-producto");
    if (!select.options.length) return;
    const precio = select.options[select.selectedIndex].getAttribute("data-precio");
    const cant = document.getElementById("v-cantidad").value;
    document.getElementById("v-total").value = `Q ${(precio * cant).toFixed(2)}`;
  }

  async function guardarVenta() {
    const rawTotal = document.getElementById("v-total").value.replace("Q ", "");
    const payload = {
      action: "addVenta",
      usuario: currentUser,
      producto: document.getElementById("v-producto").value,
      cantidad: document.getElementById("v-cantidad").value,
      total: rawTotal
    };
    await apiRequest(payload);
    alert("Venta registrada con éxito");
    cargarInventario();
    showTab("ventas");
  }
</script>

</body>
</html>
